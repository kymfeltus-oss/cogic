<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" role="img" aria-label="300 Awakening dashboard">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8FF"/><stop offset=".48" stop-color="#6A00FF"/><stop offset="1" stop-color="#FF008C"/></linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#001b36"/><stop offset=".5" stop-color="#140019"/><stop offset="1" stop-color="#300014"/></linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00172b"/><stop offset="1" stop-color="#020005"/></linearGradient>
    <linearGradient id="cardPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0018"/><stop offset="1" stop-color="#020005"/></linearGradient>
    <linearGradient id="cardViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14002a"/><stop offset="1" stop-color="#020005"/></linearGradient>
    <filter id="glowC" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowBig" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6A00FF" flood-opacity=".65"/></filter>
    <radialGradient id="leftGlow" cx="12%" cy="35%" r="65%"><stop offset="0" stop-color="#00B8FF" stop-opacity=".7"/><stop offset=".35" stop-color="#006CFF" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="rightGlow" cx="88%" cy="38%" r="65%"><stop offset="0" stop-color="#FF008C" stop-opacity=".75"/><stop offset=".36" stop-color="#FF2BD6" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="55%"><stop offset="0" stop-color="#6A00FF" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity=".16"/></pattern>
    <style><![CDATA[
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:7px;fill:#fff}
      .micro{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:4px;fill:#fff}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:2px;fill:#fff}
      .body{font-family:Arial,Helvetica,sans-serif;fill:#d9e6ff}
      .pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}.sweep{animation:sweep 4s linear infinite}.wave{stroke-linecap:round;stroke-linejoin:round;fill:none}.spark{filter:url(#glowC);opacity:.75}
      @keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.025)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes sweep{0%{transform:translateX(-45px)}100%{transform:translateX(45px)}}
    ]]></style>
  </defs>
  <rect width="1080" height="1920" fill="#030006"/>
  <rect width="1080" height="1920" fill="url(#leftGlow)"/>
  <rect width="1080" height="1920" fill="url(#rightGlow)"/>
  <rect width="1080" height="1920" fill="url(#centerGlow)"/>
  <rect width="1080" height="1920" fill="url(#dots)" opacity=".18"/>
  <g opacity=".75" filter="url(#glowC)">
    <path d="M0 280 C150 245 205 320 320 250" stroke="#00B8FF" stroke-width="2" opacity=".35" fill="none"/>
    <path d="M760 240 C890 310 960 230 1080 290" stroke="#FF008C" stroke-width="2" opacity=".35" fill="none"/>
    <path d="M540 0 L540 760" stroke="#6A00FF" stroke-width="8" opacity=".22"/>
  </g>
  <g class="spark">
    <circle cx="82" cy="318" r="5" fill="#00B8FF"/><circle cx="975" cy="285" r="5" fill="#FF008C"/><circle cx="116" cy="865" r="4" fill="#FF008C"/><circle cx="920" cy="870" r="4" fill="#00B8FF"/><circle cx="760" cy="118" r="3" fill="#FF008C"/><circle cx="320" cy="130" r="3" fill="#00B8FF"/>
  </g>

  <!-- Header without phone status bar -->
  <g transform="translate(0,54)">
    <circle cx="95" cy="82" r="35" fill="#050009" stroke="#fff" stroke-opacity=".35"/><path d="M78 72 H112 M78 82 H112 M78 92 H112" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="985" cy="82" r="35" fill="#050009" stroke="url(#brandGrad)" stroke-width="2"/><circle cx="985" cy="72" r="9" fill="none" stroke="#fff" stroke-width="3"/><path d="M967 100 C973 86 997 86 1003 100" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <g filter="url(#glowBig)" class="pulse">
      <text x="540" y="78" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="98" font-weight="900" fill="url(#brandGrad)" letter-spacing="-6">300</text>
      <text x="540" y="128" text-anchor="middle" class="small" font-size="23" fill="url(#brandGrad)">AWAKENING</text>
    </g>
  </g>

  <text x="540" y="250" text-anchor="middle" class="small" font-size="29" fill="url(#brandGrad)">LIVE RECORDING EXPERIENCE</text>
  <g filter="url(#glowC)"><rect x="432" y="284" width="216" height="44" rx="22" fill="#13000f" stroke="#FF008C" stroke-width="2"/><circle cx="463" cy="306" r="8" fill="#FF008C"/><text x="540" y="313" text-anchor="middle" class="micro" font-size="18">LIVE READY</text></g>

  <!-- Hero card -->
  <g class="pulse" transform="translate(54,375)">
    <rect width="972" height="333" rx="43" fill="url(#heroGrad)" stroke="url(#brandGrad)" stroke-width="3" filter="url(#glowBig)"/>
    <path d="M0 174 C85 160 95 195 150 170 C195 148 205 205 250 174 C300 140 310 205 360 174 C415 139 420 210 475 174 C525 145 550 194 600 174 C650 148 665 205 725 174 C785 140 810 210 865 174 C905 153 940 184 972 174" stroke="url(#brandGrad)" stroke-width="4" fill="none" filter="url(#glowC)"/>
    <text x="486" y="84" text-anchor="middle" class="small" font-size="24">ENTER</text>
    <text x="486" y="137" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="55" font-weight="900" fill="#fff" letter-spacing="3" filter="url(#glowC)">LIVE EXPERIENCE</text>
    <circle cx="486" cy="210" r="58" fill="#07000b" stroke="#8E42FF" stroke-width="4" filter="url(#glowC)"/>
    <path d="M472 180 L472 240 L520 210 Z" fill="#fff" filter="url(#glowC)"/>
  </g>

  <!-- Countdown strip -->
  <g transform="translate(54,745)">
    <rect width="972" height="126" rx="24" fill="#050006" stroke="#ffffff" stroke-opacity=".15" filter="url(#shadow)"/>
    <g transform="translate(65,63)" filter="url(#glowC)"><path class="wave" d="M0 0 L13 0 L16 -8 L20 0 L30 0 L34 -18 L39 0 L50 0 L55 -12 L60 0 L80 0" stroke="url(#brandGrad)" stroke-width="5"/></g>
    <text x="230" y="56" class="label" font-size="20">LIVE RECORDING</text><text x="230" y="86" class="label" font-size="20" fill="#FF008C">COMING SOON</text>
    <line x1="548" y1="33" x2="548" y2="94" stroke="#fff" stroke-opacity=".14"/>
    <text x="790" y="38" text-anchor="middle" class="micro" font-size="14" fill="#ffb0df">EVENT STARTS IN</text>
    <text x="790" y="82" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="40" fill="url(#brandGrad)" filter="url(#glowC)">02 : 17 : 45 : 32</text>
    <text x="790" y="105" text-anchor="middle" class="micro" font-size="10" fill="#cdd6e9">DAYS  HRS  MINS  SECS</text>
  </g>

  <!-- Card component groups -->
  <g transform="translate(54,915)">
    <g><rect width="300" height="360" rx="22" fill="url(#cardBlue)" stroke="#00B8FF" stroke-width="2" filter="url(#glowC)"/><path d="M103 62 h72 v48 h-72z M128 110 v30 M106 140 h66" fill="none" stroke="#00B8FF" stroke-width="5" stroke-linecap="round"/><path d="M133 75 L133 98 L153 86 Z" fill="#00B8FF"/><text x="150" y="215" text-anchor="middle" class="label" font-size="38">WATCH</text><text x="150" y="260" text-anchor="middle" class="label" font-size="38">LIVE</text><path d="M118 286 C130 280 134 295 145 286 C155 280 160 295 172 286" stroke="#00B8FF" stroke-width="3" fill="none"/><text x="150" y="324" text-anchor="middle" class="body" font-size="20">Join the live</text><text x="150" y="350" text-anchor="middle" class="body" font-size="20">recording experience</text></g>
    <g transform="translate(336,0)"><rect width="300" height="360" rx="22" fill="url(#cardPink)" stroke="#FF008C" stroke-width="2" filter="url(#glowC)"/><path d="M150 70 C125 35 80 65 99 105 C116 136 150 158 150 158 C150 158 184 136 201 105 C220 65 175 35 150 70 Z" fill="none" stroke="#FF008C" stroke-width="5"/><text x="150" y="215" text-anchor="middle" class="label" font-size="34">VITAL SEED</text><text x="150" y="260" text-anchor="middle" class="label" font-size="34">GIVING</text><path d="M118 286 C130 280 134 295 145 286 C155 280 160 295 172 286" stroke="#FF008C" stroke-width="3" fill="none"/><text x="150" y="324" text-anchor="middle" class="body" font-size="20">Sow into this</text><text x="150" y="350" text-anchor="middle" class="body" font-size="20">historic moment</text></g>
    <g transform="translate(672,0)"><rect width="300" height="360" rx="22" fill="url(#cardViolet)" stroke="#FF2BD6" stroke-width="2" filter="url(#glowC)"/><path d="M155 55 v95 M155 55 l63 -18 v95 M155 150 a25 18 0 1 1 -1 -1 M218 132 a25 18 0 1 1 -1 -1" fill="none" stroke="#FF2BD6" stroke-width="5"/><text x="150" y="205" text-anchor="middle" class="label" font-size="31">HALLELUJAH</text><text x="150" y="250" text-anchor="middle" class="label" font-size="31">ANYHOW!</text><path d="M118 280 C130 274 134 289 145 280 C155 274 160 289 172 280" stroke="#FF2BD6" stroke-width="3" fill="none"/><text x="150" y="318" text-anchor="middle" class="body" font-size="20">Stream or download</text><text x="150" y="344" text-anchor="middle" class="body" font-size="20">the new single</text></g>
    <g transform="translate(0,405)"><rect width="300" height="360" rx="22" fill="url(#cardBlue)" stroke="#006CFF" stroke-width="2" filter="url(#glowC)"/><rect x="103" y="56" width="94" height="98" rx="8" fill="none" stroke="#6A00FF" stroke-width="5"/><path d="M124 45 v30 M176 45 v30 M103 88 h94" stroke="#00B8FF" stroke-width="5"/><path d="M150 103 l11 22 24 3 -17 16 4 24 -22 -12 -22 12 4 -24 -17 -16 24 -3z" fill="none" stroke="#B46AFF" stroke-width="4"/><text x="150" y="215" text-anchor="middle" class="label" font-size="35">EVENT</text><text x="150" y="260" text-anchor="middle" class="label" font-size="35">UPDATES</text><path d="M118 286 C130 280 134 295 145 286 C155 280 160 295 172 286" stroke="#00B8FF" stroke-width="3" fill="none"/><text x="150" y="324" text-anchor="middle" class="body" font-size="20">Stay updated on</text><text x="150" y="350" text-anchor="middle" class="body" font-size="20">everything 300</text></g>
    <g transform="translate(336,405)"><rect width="300" height="360" rx="22" fill="url(#cardViolet)" stroke="#B46AFF" stroke-width="2" filter="url(#glowC)"/><path d="M85 135 l24 -64 40 45 42 -66 24 85 z" fill="none" stroke="#B46AFF" stroke-width="5"/><circle cx="109" cy="72" r="8" fill="#B46AFF"/><circle cx="149" cy="114" r="8" fill="#B46AFF"/><circle cx="191" cy="54" r="8" fill="#B46AFF"/><text x="150" y="215" text-anchor="middle" class="label" font-size="33">EXCLUSIVE</text><text x="150" y="260" text-anchor="middle" class="label" font-size="33">CONTENT</text><path d="M118 286 C130 280 134 295 145 286 C155 280 160 295 172 286" stroke="#FF2BD6" stroke-width="3" fill="none"/><text x="150" y="324" text-anchor="middle" class="body" font-size="20">Behind the scenes,</text><text x="150" y="350" text-anchor="middle" class="body" font-size="20">bloopers &amp; more</text></g>
    <g transform="translate(672,405)"><rect width="300" height="360" rx="22" fill="url(#cardPink)" stroke="#FF008C" stroke-width="2" filter="url(#glowC)"/><path d="M95 82 C95 50 124 30 164 30 C209 30 238 57 238 91 C238 125 210 150 166 150 H137 L103 174 L112 145 C102 130 95 108 95 82 Z" fill="none" stroke="#FF2BD6" stroke-width="5"/><circle cx="145" cy="91" r="5" fill="#FF2BD6"/><circle cx="166" cy="91" r="5" fill="#FF2BD6"/><circle cx="187" cy="91" r="5" fill="#FF2BD6"/><text x="150" y="215" text-anchor="middle" class="label" font-size="35">PRAYER</text><text x="150" y="260" text-anchor="middle" class="label" font-size="35">WALL</text><path d="M118 286 C130 280 134 295 145 286 C155 280 160 295 172 286" stroke="#FF2BD6" stroke-width="3" fill="none"/><text x="150" y="324" text-anchor="middle" class="body" font-size="20">Share your prayer</text><text x="150" y="350" text-anchor="middle" class="body" font-size="20">requests &amp; testimonies</text></g>
  </g>

  <!-- Bottom banner -->
  <g transform="translate(54,1715)"><rect width="972" height="98" rx="26" fill="#050006" stroke="url(#brandGrad)" stroke-width="1.5" opacity=".9"/><path d="M20 50 C70 30 80 70 130 50 C170 32 200 67 245 50" stroke="#00B8FF" stroke-width="4" fill="none" filter="url(#glowC)"/><path d="M727 50 C780 30 800 68 850 50 C900 30 920 70 952 50" stroke="#FF008C" stroke-width="4" fill="none" filter="url(#glowC)"/><text x="486" y="43" text-anchor="middle" class="small" font-size="28">WE ARE THE 300</text><text x="486" y="76" text-anchor="middle" class="micro" font-size="16" fill="url(#brandGrad)">REVIVAL. RECORDING. HISTORY.</text></g>

  <!-- Bottom nav, no phone asset -->
  <g transform="translate(0,1840)"><rect width="1080" height="80" fill="#050006" opacity=".96"/><g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M133 40 l22 -20 22 20 v25 h-44z" stroke="#fff"/><circle cx="335" cy="43" r="16" opacity=".7"/><path d="M330 43 h10" opacity=".7"/><path d="M530 34 C515 15 480 30 492 57 C502 80 530 91 530 91 C530 91 558 80 568 57 C580 30 545 15 530 34 Z" opacity=".7"/><path d="M728 25 v43 M728 25 l36 -10 v43 M728 68 a13 9 0 1 1 -1 -1 M764 58 a13 9 0 1 1 -1 -1" opacity=".7"/><circle cx="902" cy="48" r="3"/><circle cx="932" cy="48" r="3"/><circle cx="962" cy="48" r="3"/></g><text x="155" y="70" text-anchor="middle" class="micro" font-size="14">HOME</text><text x="335" y="70" text-anchor="middle" class="micro" font-size="14" opacity=".6">LIVE</text><text x="530" y="70" text-anchor="middle" class="micro" font-size="14" opacity=".6">GIVING</text><text x="746" y="70" text-anchor="middle" class="micro" font-size="14" opacity=".6">MUSIC</text><text x="932" y="70" text-anchor="middle" class="micro" font-size="14" opacity=".6">MORE</text><rect x="95" y="76" width="120" height="4" rx="2" fill="url(#brandGrad)" filter="url(#glowC)"/></g>
</svg>
